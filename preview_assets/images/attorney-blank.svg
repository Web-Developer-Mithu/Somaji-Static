<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="whiteGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#a8885c" />
    </linearGradient>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="400" height="480" fill="url(#whiteGrad)" />
  
  <!-- Subtle Elegant Inner Border -->
  <rect x="15" y="15" width="370" height="450" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Chamber Emblem Law Icon / Lawyer Silhouette in Soft Gold -->
  <g transform="translate(200, 210)" text-anchor="middle">
    <!-- Outer Seal Ring -->
    <circle cx="0" cy="0" r="75" fill="#f8fafc" stroke="#c5a880" stroke-width="2" opacity="0.85" />
    <circle cx="0" cy="0" r="68" fill="none" stroke="#c5a880" stroke-width="0.8" opacity="0.4" stroke-dasharray="3 3" />

    <!-- Scales of Justice Symbol -->
    <g transform="translate(0, -5)" stroke="#c5a880" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Central Pillar -->
      <line x1="0" y1="-38" x2="0" y2="28" stroke-width="3" />
      <!-- Top Finial -->
      <circle cx="0" cy="-42" r="3.5" fill="#c5a880" />
      <!-- Beam -->
      <line x1="-36" y1="-26" x2="36" y2="-26" stroke-width="3" />
      
      <!-- Left Pan -->
      <line x1="-36" y1="-26" x2="-46" y2="-2" stroke-width="1.2" />
      <line x1="-36" y1="-26" x2="-26" y2="-2" stroke-width="1.2" />
      <path d="M -50 -2 Q -36 12 -22 -2 Z" fill="#c5a880" opacity="0.25" stroke="#c5a880" stroke-width="2" />

      <!-- Right Pan -->
      <line x1="36" y1="-26" x2="26" y2="-2" stroke-width="1.2" />
      <line x1="36" y1="-26" x2="46" y2="-2" stroke-width="1.2" />
      <path d="M 22 -2 Q 36 12 50 -2 Z" fill="#c5a880" opacity="0.25" stroke="#c5a880" stroke-width="2" />

      <!-- Base -->
      <line x1="-22" y1="28" x2="22" y2="28" stroke-width="3" />
      <line x1="-14" y1="24" x2="14" y2="24" stroke-width="2" />
    </g>

    <!-- Subtext -->
    <text y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.2" text-transform="uppercase">
      CHAMBER COUNSEL
    </text>
    <text y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" letter-spacing="0.8">
      Official Portrait In Preparation
    </text>
  </g>
</svg>
